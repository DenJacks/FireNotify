<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireNotify Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#FFF7F0;
}

.login-box{
    width:400px;
    margin:auto;
    margin-top:80px;
    background:white;
    border-radius:15px;
    box-shadow:0px 0px 20px rgba(0,0,0,.15);
    padding:40px;
}

.logo{

    width:90px;
    display:block;
    margin:auto;

}

.title{

    text-align:center;
    font-size:30px;
    color:#E65100;
    font-weight:bold;

}

.subtitle{

    text-align:center;
    color:gray;
    margin-bottom:30px;

}

.btn-login{

    background:#F57C00;
    color:white;

}

.btn-login:hover{

    background:#E65100;
    color:white;

}

</style>

</head>
<body>

<div class="login-box">

<img src="logo.png" class="logo">

<div class="title">

FireNotify

</div>

<div class="subtitle">

Bureau of Fire Protection

</div>

<form>

<div class="mb-3">

<label>Username</label>

<input type="text" class="form-control">

</div>

<div class="mb-3">

<label>Password</label>

<input type="password" class="form-control">

</div>

<button class="btn btn-login w-100">

Login

</button>

</form>

</div>

</body>
</html>
